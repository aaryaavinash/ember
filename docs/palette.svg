<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc"><title id="title">Hammer &amp; Ember visual palette</title><desc id="desc">The site's background, ink, accent, and secondary colors with its display typography.</desc><rect width="1200" height="300" fill="#0a0806"/><path d="M40 36H1160M40 272H1160" stroke="#ffb35a" stroke-opacity=".7"/><text x="54" y="69" fill="#ffb35a" font-family="Arial,sans-serif" font-size="12" letter-spacing="3">VISUAL LANGUAGE / CRAFT</text><text x="54" y="166" fill="#ff6a1f" font-family="Georgia,serif" font-style="italic" font-size="62">Hammer &amp; Ember</text><text x="54" y="220" fill="#ece4d6" font-family="Arial,sans-serif" font-size="20">Every blade is folded 512 times</text><text x="54" y="254" fill="#ffb35a" font-family="Arial,sans-serif" font-size="11" letter-spacing="1.2">OSWALD · CRIMSON PRO</text><g transform="translate(800 93)"><rect width="76" height="76" fill="#0a0806" stroke="#ffb35a"/><rect x="90" width="76" height="76" fill="#ece4d6"/><rect x="180" width="76" height="76" fill="#ff6a1f"/><rect x="270" width="76" height="76" fill="#ffb35a"/><g fill="#ffb35a" font-family="Arial,sans-serif" font-size="10" letter-spacing="1.5"><text x="0" y="96">GROUND</text><text x="90" y="96">INK</text><text x="180" y="96">ACCENT</text><text x="270" y="96">SECOND</text></g></g></svg>